version: "3.9"

services:
  vuln-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnscan
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - scanner-net

networks:
  scanner-net:
    driver: bridge