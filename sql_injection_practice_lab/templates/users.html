<!doctype html>
<html>
<head>
    <title>Demo Users</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <a href="/">← Home</a>
    <h1>Demo Users</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Password</th>
            <th>Role</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user["id"] }}</td>
            <td>{{ user["username"] }}</td>
            <td>Hidden in UI</td>
            <td>{{ user["role"] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
